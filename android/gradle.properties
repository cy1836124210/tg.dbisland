android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
# 第 71 条（发布交付）：AGP 默认拒绝**路径含非 ASCII 字符**的工程（Windows 上
# 报 "Your project path contains non-ASCII characters" 直接失败）。发布包解压后
# 的目录名是中文（豆包岛桥-v1.2-源码），不解开这个开关就等于「交付的源码包
# 在交付的路径下编译不了」。本工程无 native/NDK 代码，已实测中文路径下
# `compileReleaseKotlin` / `distRelease` 均可通过，故显式关掉该检查。
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# 第 36 条加 Compose 依赖时踩过：某个仓库不响应时 Gradle 会**静默挂住**
# （实测 20 分钟没有任何缓存写入、CPU 也不动）。这几个超时让它在分钟级失败，
# 而不是无限等；失败后重跑即可（已下好的部分会命中缓存）。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
